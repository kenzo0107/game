<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#140f33">
    <title>ほしくっつけ</title>
    <script src="../shared/audio-session.js"></script>
    <script src="../shared/no-zoom.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hud">
        <div><span class="label">SCORE</span><b id="score">0</b></div>
        <div><span class="label">HI</span><b id="hi">0</b></div>
        <div class="next"><span class="label">つぎ</span><canvas id="next"></canvas></div>
        <button type="button" id="pause" class="icon" aria-label="いちじていし">⏸</button>
        <button type="button" id="sound" class="icon" aria-pressed="true" aria-label="おと">♪</button>
    </header>

    <main class="play" id="play">
        <div class="well">
            <canvas id="board"></canvas>
            <div class="toast" id="toast" aria-live="polite"></div>
        </div>
        <canvas id="chain"></canvas>
    </main>

    <div class="overlay" id="overlay">
        <div class="panel">
            <h1 id="overlay-title">ほしくっつけ</h1>
            <p id="overlay-text">
                おなじ ほしが ぶつかると <b>くっついて</b><br>
                ひとつ おおきな ほしに なるよ。<br>
                めざせ <b>たいよう</b>！<br>
                <small>てんせんより うえに つみあがったら おしまい。</small>
            </p>
            <p class="howto only-touch">ゆびで よこに うごかして、はなすと おちるよ</p>
            <p class="howto only-key">←→・マウス いどう ／ スペース・↓・クリック おとす ／ P ていし</p>
            <button type="button" id="start" class="primary">あそぶ</button>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
