<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pilot Wings Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #app {
      width: 100vw;
      height: 100dvh;
    }
    #back {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      color: white;
      text-decoration: none;
      font-size: 1.3rem;
      background: rgba(0, 0, 0, 0.5);
    }
    #info {
      position: absolute;
      top: 60px;
      left: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
    }
    #hud {
      position: absolute;
      top: 10px;
      right: 10px;
      color: #00ff00;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
      font-size: 16px;
      font-family: 'Courier New', monospace;
      min-width: 200px;
    }
    #hud span {
      color: #ffff00;
      font-weight: bold;
    }
    #touch-controls {
      display: none;
    }
    @media (pointer: coarse) {
      #info {
        display: none;
      }
      #hud {
        top: max(8px, env(safe-area-inset-top));
        right: max(8px, env(safe-area-inset-right));
        padding: 6px 8px;
        font-size: 11px;
        min-width: 0;
      }
      #touch-controls {
        display: block;
      }
    }
    #stick {
      position: absolute;
      left: max(24px, env(safe-area-inset-left));
      bottom: max(24px, env(safe-area-inset-bottom));
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.5);
      display: grid;
      place-items: center;
    }
    #stick-knob {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      pointer-events: none;
    }
    #buttons {
      position: absolute;
      right: max(24px, env(safe-area-inset-right));
      bottom: max(24px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(2, 64px);
      gap: 12px;
    }
    #buttons button {
      height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.6);
      background: rgba(0, 0, 0, 0.35);
      color: white;
      font-size: 13px;
      font-weight: bold;
    }
    #buttons button.pressed {
      background: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <a id="back" href="../" aria-label="トップへ戻る">←</a>
  <div id="info">
    <div style="font-weight: bold; margin-bottom: 5px;">操作方法:</div>
    <div>W/S: 速度増減</div>
    <div>↑/↓: ピッチ（上昇/下降）</div>
    <div>←/→: ロール（左右旋回）</div>
    <div>Q/E: ヨー（機首左右）</div>
    <div>着陸後: S でブレーキ、Q/E でハンドル</div>
  </div>
  <div id="hud">
    <div style="font-weight: bold; margin-bottom: 5px;">飛行データ:</div>
    <div>燃料: <span id="fuel">100</span>%</div>
    <div>速度: <span id="speed">0</span></div>
    <div>スロットル: <span id="throttle">0</span>%</div>
    <div>ピッチ角: <span id="pitch">0</span>°</div>
    <div>ロール角: <span id="roll">0</span>°</div>
    <div>高度: <span id="altitude">0</span></div>
  </div>
  <div id="touch-controls">
    <div id="stick"><div id="stick-knob"></div></div>
    <div id="buttons">
      <button type="button" data-action="throttleDown">減速</button>
      <button type="button" data-action="throttleUp">加速</button>
      <button type="button" data-action="yawLeft">機首←</button>
      <button type="button" data-action="yawRight">機首→</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
