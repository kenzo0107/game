<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>パイロット</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    #app {
      position: fixed;
      inset: 0;
    }
    #back {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      color: white;
      text-decoration: none;
      font-size: 1.3rem;
      background: rgba(0, 0, 0, 0.5);
    }
    #info {
      position: absolute;
      top: 60px;
      left: 10px;
      color: white;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
    }
    #hud {
      position: absolute;
      top: 10px;
      right: 10px;
      color: #00ff00;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
      font-size: 16px;
      font-family: 'Courier New', monospace;
      min-width: 200px;
    }
    #hud span {
      color: #ffff00;
      font-weight: bold;
    }
    #touch-controls {
      display: none;
    }
    body:not([data-mode="flight"]) .flight-only,
    body:not([data-mode="skydive"]) .skydive-only,
    body:not([data-mode="rocket"]) .rocket-only,
    body[data-mode="skydive"] .has-fuel,
    body[data-mode="flight"] .has-target {
      display: none !important;
    }
    @media (pointer: coarse) {
      #info {
        display: none;
      }
      #hud {
        top: max(8px, env(safe-area-inset-top));
        right: max(8px, env(safe-area-inset-right));
        padding: 6px 8px;
        font-size: 11px;
        min-width: 0;
      }
      #touch-controls {
        display: block;
      }
    }
    #stick {
      position: absolute;
      left: max(24px, env(safe-area-inset-left));
      bottom: max(24px, env(safe-area-inset-bottom));
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.5);
      display: grid;
      place-items: center;
    }
    #stick-knob {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      pointer-events: none;
    }
    #buttons {
      position: absolute;
      right: max(24px, env(safe-area-inset-right));
      bottom: max(24px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(2, 64px);
      gap: 12px;
    }
    #buttons button {
      height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.6);
      background: rgba(0, 0, 0, 0.35);
      color: white;
      font-size: 13px;
      font-weight: bold;
    }
    #buttons .deploy {
      grid-column: span 2;
      border-radius: 32px;
      background: rgba(230, 60, 40, 0.6);
    }
    #buttons button.pressed {
      background: rgba(255, 255, 255, 0.5);
    }
    #overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(560px, 92vw);
      max-height: 92dvh;
      overflow-y: auto;
      color: white;
      background: rgba(0, 0, 0, 0.8);
      padding: 20px 24px;
      border-radius: 12px;
      text-align: center;
      z-index: 10;
    }
    #overlay[hidden] {
      display: none;
    }
    #overlay.clear {
      background: rgba(0, 110, 40, 0.85);
    }
    #overlay h1 {
      font-size: 36px;
      margin-bottom: 8px;
    }
    #overlay p {
      font-size: 16px;
      margin-bottom: 6px;
    }
    #overlay p:first-of-type {
      color: #ffdd55;
    }
    #overlay .choices {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }
    #overlay button {
      font: inherit;
      font-size: 16px;
      font-weight: bold;
      padding: 10px 14px;
      border-radius: 8px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.12);
      color: white;
      cursor: pointer;
    }
    #overlay button:first-child:not(:disabled) {
      background: #ff7700;
      border-color: #ffbb66;
    }
    #overlay.menu button:first-child:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.7);
    }
    #overlay button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    #banner {
      position: absolute;
      top: 18%;
      left: 50%;
      transform: translate(-50%, -20px);
      display: grid;
      gap: 6px;
      padding: 12px 20px;
      border-radius: 10px;
      color: white;
      text-align: center;
      background: rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s, transform 0.4s;
    }
    #banner.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    #banner strong {
      font-size: 24px;
      color: #ffdd55;
    }
    #low-altitude {
      position: absolute;
      top: 32%;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 18px;
      border-radius: 10px;
      border: 2px solid #ff5544;
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      white-space: nowrap;
      background: rgba(180, 20, 10, 0.7);
      pointer-events: none;
      animation: low-altitude-blink 0.9s steps(2, jump-none) infinite;
    }
    #low-altitude[hidden] {
      display: none;
    }
    @keyframes low-altitude-blink {
      50% {
        opacity: 0.35;
      }
    }
    @media (pointer: coarse) {
      #overlay h1 {
        font-size: 26px;
      }
      #overlay p,
      #overlay button {
        font-size: 14px;
      }
      #overlay button {
        padding: 8px 10px;
      }
      #banner strong {
        font-size: 18px;
      }
      #banner span {
        font-size: 13px;
      }
      #low-altitude {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <a id="back" href="../" aria-label="トップへ戻る">←</a>
  <div id="info">
    <div style="font-weight: bold; margin-bottom: 5px;">操作方法:</div>
    <div>W/S: 速度増減</div>
    <div>↑/↓: ピッチ（上昇/下降）</div>
    <div>←/→: ロール（かたむけて左右旋回）</div>
    <div>Q/E: ヨー（機首左右）</div>
    <div>着陸後: S でブレーキ、Q/E でハンドル</div>
    <div>ロケットベルト: W 上昇 / S 下降 / 矢印 移動</div>
    <div>Enter: 決定 / R: やり直し</div>
  </div>
  <div id="hud">
    <div style="font-weight: bold; margin-bottom: 5px;">飛行データ:</div>
    <div>ステージ: <span id="stage">1</span></div>
    <div>リング: <span id="rings">0</span></div>
    <div>風: <span id="wind">なし</span></div>
    <div>高度: <span id="altitude">0</span></div>
    <div class="has-fuel">燃料: <span id="fuel">100</span>%</div>
    <div class="flight-only">
      <div>速度: <span id="speed">0</span></div>
      <div>スロットル: <span id="throttle">0</span>%</div>
      <div>ピッチ角: <span id="pitch">0</span>°</div>
      <div>ロール角: <span id="roll">0</span>°</div>
    </div>
    <div class="skydive-only">
      <div>落下速度: <span id="fall-speed">0</span></div>
      <div>パラシュート: <span id="chute">まだ</span></div>
    </div>
    <div class="rocket-only">上下速度: <span id="vertical-speed">0</span></div>
    <div class="has-target">的まで: <span id="target">0</span></div>
  </div>
  <div id="touch-controls">
    <div id="stick"><div id="stick-knob"></div></div>
    <div id="buttons">
      <button type="button" data-action="throttleDown">減速</button>
      <button type="button" data-action="throttleUp">加速</button>
      <button type="button" data-action="yawLeft">機首←</button>
      <button type="button" data-action="yawRight">機首→</button>
      <button type="button" class="deploy skydive-only" data-action="deploy">パラシュート</button>
    </div>
  </div>
  <div id="banner" aria-live="polite"></div>
  <div id="low-altitude" role="alert" hidden></div>
  <div id="overlay" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
