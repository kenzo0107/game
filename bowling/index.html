<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>100ピン ボウリング</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #111; font-family: 'Arial', sans-serif; }
    body { container-type: size; }
    canvas { display: block; touch-action: none; }
    .hud { position: absolute; pointer-events: none; color: #fff; }
    #scoreboard {
      top: 8px; left: 50%; transform: translateX(-50%); display: flex;
      background: rgba(0, 0, 0, 0.6); border-radius: 6px; padding: 4px; max-width: calc(100% - 16px);
    }
    .frame { border: 1px solid #666; min-width: 34px; text-align: center; }
    .frame.current { border-color: #ffd54a; }
    .frame .no { font-size: 10px; color: #aaa; }
    .frame .marks { font-size: 11px; display: flex; justify-content: center; gap: 3px; min-height: 14px; }
    .frame .total { font-size: 13px; font-weight: bold; min-height: 16px; }
    #status {
      top: 72px; left: 12px; font-size: 14px; background: rgba(0, 0, 0, 0.5);
      padding: 6px 10px; border-radius: 6px; max-width: calc(100% - 24px);
    }
    #points {
      top: 108px; left: 12px; font-size: 16px; font-weight: bold; color: #ffd54a;
      background: rgba(0, 0, 0, 0.5); padding: 6px 10px; border-radius: 6px;
    }
    #message {
      top: 36%; left: 50%; transform: translate(-50%, -50%); color: #ffd54a; font-size: 44px;
      font-weight: bold; text-shadow: 0 3px 8px #000; text-align: center; white-space: nowrap;
    }
    #bonus {
      top: 47%; left: 50%; transform: translate(-50%, -50%); font-size: 26px; font-weight: bold;
      text-shadow: 0 2px 6px #000; text-align: center; white-space: nowrap;
    }
    #bonus .mult { color: #ff6ec7; font-size: 34px; }
    #hint {
      bottom: 24px; left: 50%; transform: translateX(-50%); font-size: 15px;
      background: rgba(0, 0, 0, 0.5); padding: 8px 14px; border-radius: 20px; white-space: nowrap;
    }
    #power {
      bottom: 70px; left: 50%; transform: translateX(-50%); width: 200px; height: 12px;
      background: rgba(255, 255, 255, 0.2); border-radius: 6px; overflow: hidden; display: none;
    }
    #power-bar { height: 100%; width: 0; background: linear-gradient(90deg, #4caf50, #ffeb3b, #f44336); }
    .corner-btn {
      position: absolute; bottom: 16px; width: 44px; height: 44px; border-radius: 50%; border: none;
      background: rgba(0, 0, 0, 0.55); color: #fff; font-size: 20px; cursor: pointer;
    }
    #back { left: 12px; }
    #to-top {
      position: absolute; top: 8px; left: 8px; z-index: 1; display: grid; place-items: center;
      width: 40px; height: 40px; border-radius: 50%; background: rgba(0, 0, 0, 0.55);
      color: #fff; font-size: 20px; text-decoration: none;
    }
    @container (max-width: 480px) {
      #scoreboard { left: 56px; right: 8px; transform: none; max-width: none; }
      .frame { flex: 1; min-width: 0; }
      .frame .marks { gap: 1px; }
    }
    .move-btn {
      position: absolute; top: 55%; width: 60px; height: 60px; border-radius: 50%; border: none;
      background: rgba(255, 213, 74, 0.85); color: #222; font-size: 26px; cursor: pointer;
      touch-action: none; user-select: none; -webkit-user-select: none; display: none;
    }
    #move-left { left: 12px; }
    #move-right { right: 12px; }
    #sound { right: 12px; }
    button.big {
      font-size: 18px; padding: 12px 24px; border: none; border-radius: 24px; background: #ffd54a;
      color: #222; font-weight: bold; cursor: pointer; margin: 6px;
    }
    button.big.sub { background: #e0e0e0; }
    button:disabled { opacity: 0.4; cursor: default; }
    #panel {
      position: absolute; top: 58%; left: 50%; transform: translateX(-50%);
      display: none; text-align: center; white-space: nowrap;
    }
    #menu {
      position: absolute; inset: 0; background: rgba(10, 12, 30, 0.88); color: #fff;
      overflow-y: auto; padding: 24px 16px; text-align: center;
    }
    #menu h1 { font-size: 34px; color: #ffd54a; margin: 24px 0 8px; text-shadow: 0 3px 0 #b8860b; }
    #menu h2 { font-size: 24px; margin: 8px 0 16px; }
    #menu .pts { font-size: 20px; color: #ffd54a; margin-bottom: 24px; }
    .course {
      background: rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 12px;
      margin: 0 auto 14px; max-width: 460px;
    }
    .course h3 { font-size: 18px; margin-bottom: 8px; }
    .stages { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
    .stage-btn {
      width: 72px; padding: 8px 0; border-radius: 10px; border: none; background: #4fc3f7;
      color: #01303f; font-weight: bold; cursor: pointer; font-size: 14px;
    }
    .stage-btn.cleared { background: #81c784; }
    .unlock-btn {
      font-size: 16px; padding: 10px 18px; border: none; border-radius: 20px;
      background: #ff6ec7; color: #fff; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="scoreboard" class="hud"></div>
  <div id="status" class="hud"></div>
  <div id="points" class="hud"></div>
  <div id="message" class="hud"></div>
  <div id="bonus" class="hud"></div>
  <div id="power" class="hud"><div id="power-bar"></div></div>
  <div id="hint" class="hud">◀▶で位置、下に引っ張って投球</div>
  <div id="panel"></div>
  <button id="move-left" class="move-btn" aria-label="ボールを左へ">◀</button>
  <button id="move-right" class="move-btn" aria-label="ボールを右へ">▶</button>
  <button id="back" class="corner-btn" aria-label="メニュー">≡</button>
  <button id="sound" class="corner-btn" aria-label="音のオンオフ">♪</button>
  <div id="menu"></div>
  <a id="to-top" href="../" aria-label="トップへ戻る">←</a>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
