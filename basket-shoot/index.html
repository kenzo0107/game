<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#14102e">
    <title>バスケ シュート</title>
    <script src="../shared/landscape.js"></script>
    <script src="../shared/audio-session.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="court"></canvas>

    <div class="hud" aria-live="polite">
        <div><span class="label">SCORE</span><b id="score">0</b></div>
        <div><span class="label">TIME</span><b id="time">60</b></div>
        <div><span class="label">BEST</span><b id="best">0</b></div>
        <button type="button" id="sound" aria-pressed="true" aria-label="効果音">♪</button>
    </div>

    <div class="overlay" id="overlay">
        <div class="panel">
            <h1 id="overlay-title">バスケ シュート</h1>
            <p id="overlay-text">ゴールに向かってスワイプしてシュート！<br>タップでジャンプ、空中でもう1回タップで 2 だんジャンプ<br>60 秒でなんてん とれるかな？<br>きめると 1 ぽ さがるよ。3P ラインの外からは 3 てん</p>
            <button type="button" id="start">スタート</button>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
