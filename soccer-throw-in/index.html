<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#87ceeb">
    <title>サッカー スローイン 3D</title>
    <script src="../shared/landscape.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="stage"></div>

    <div class="hud">
        <a class="back" href="../" aria-label="トップへ戻る">←</a>
        <div class="score">
            <div><span class="label">飛距離</span><span id="distance">0</span>m</div>
            <div><span class="label">ベスト</span><span id="best">0</span>m</div>
        </div>
    </div>

    <div id="hint" class="hint">
        <div class="hint-title">⚽ スローイン</div>
        <ol>
            <li>画面を<b>長押し</b>で構える</li>
            <li>押したまま<b>上下にスライド</b>で角度</li>
            <li>ゲージを見て<b>指を離す</b>と投げる</li>
        </ol>
    </div>

    <div id="result" class="result" hidden>
        <div id="resultDistance" class="result-distance">0m</div>
        <div id="resultDetail" class="result-detail"></div>
        <div class="result-retry">タップでもう一度</div>
    </div>

    <div id="gauge" class="gauge" hidden>
        <div class="gauge-row">
            <span>パワー <b id="powerValue">0</b>%</span>
            <span>角度 <b id="angleValue">45</b>°</span>
        </div>
        <div class="power-bar-container">
            <div id="powerBar" class="power-bar"></div>
            <div class="power-sweet"></div>
        </div>
    </div>

    <!-- アーケード公開時は build.sh が共有版の three に書き換える -->
    <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js" } }</script>
    <script type="module" src="game.js"></script>
</body>
</html>
