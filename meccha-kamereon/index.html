<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#123d2a">
    <title>めっちゃカメレオン</title>
    <script src="../shared/landscape.js"></script>
    <script src="../shared/audio-session.js"></script>
    <script src="../shared/no-zoom.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="stage"></canvas>

    <div class="hud" aria-live="polite">
        <div><span class="label">ROUND</span><b id="round">1/5</b></div>
        <div><span class="label">TIME</span><b id="time">0</b></div>
        <div><span class="label">SCORE</span><b id="score">0</b></div>
        <div id="ammo-box" hidden><span class="label">たま</span><b id="ammo" class="ammo"></b></div>
        <button type="button" id="sound" aria-pressed="true" aria-label="効果音">♪</button>
    </div>

    <div class="controls" id="controls" hidden>
        <div class="poses" id="poses"></div>
        <div class="palette" id="palette"></div>
    </div>

    <div class="overlay" id="overlay">
        <div class="panel">
            <h1 id="overlay-title">めっちゃカメレオン</h1>
            <p id="overlay-text">8つのステージから 5かいせん！<br>かくれる：物の前に行って 色とポーズを そろえよう<br>おに：おして スコープで ねらい、はなして うて！</p>
            <div class="modes">
                <button type="button" data-mode="hide">かくれる</button>
                <button type="button" data-mode="oni" class="oni">おに</button>
            </div>
            <p class="best" id="best-text"></p>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
