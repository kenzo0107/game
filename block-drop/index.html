<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#161433">
    <title>ブロックおとし</title>
    <script src="../shared/audio-session.js"></script>
    <script src="../shared/no-zoom.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hud" id="hud">
        <div><span class="label">SCORE</span><b id="score">0</b></div>
        <div><span class="label">HI</span><b id="hi">0</b></div>
        <div><span class="label">LEVEL</span><b id="level">1</b></div>
        <div><span class="label">LINES</span><b id="lines">0</b></div>
        <button type="button" id="pause" class="icon" aria-label="いちじていし">⏸</button>
        <button type="button" id="sound" class="icon" aria-pressed="true" aria-label="おと">♪</button>
    </header>

    <main class="play" id="play">
        <aside class="side">
            <span class="label">ホールド</span>
            <canvas id="hold" class="mini"></canvas>
        </aside>
        <div class="well">
            <canvas id="board"></canvas>
            <div class="toast" id="toast" aria-live="polite"></div>
        </div>
        <aside class="side">
            <span class="label">つぎ</span>
            <canvas id="next" class="mini"></canvas>
        </aside>
    </main>

    <div class="pad" id="pad">
        <button type="button" data-action="hold" class="hold">ホールド</button>
        <button type="button" data-action="ccw" class="turn" aria-label="ひだりに まわす">↺</button>
        <button type="button" data-action="cw" class="turn" aria-label="みぎに まわす">↻</button>
        <button type="button" data-action="drop" class="drop">いっきに</button>
    </div>

    <div class="overlay" id="overlay">
        <div class="panel">
            <h1 id="overlay-title">ブロックおとし</h1>
            <p id="overlay-text">
                おちてくる ブロックを まわして ならべよう。<br>
                よこ 1れつ そろうと きえるよ。<br>
                いちばん うえまで つみあがったら おしまい！
            </p>
            <ul class="gestures only-touch">
                <li><b>ゆびで よこに なぞる</b> いどう</li>
                <li><b>タップ</b> まわす</li>
                <li><b>したに なぞる</b> はやく おとす</li>
                <li><b>したに はじく</b> いっきに おとす</li>
                <li><b>うえに はじく</b> ホールド</li>
            </ul>
            <p class="keys only-key">←→ いどう ／ ↓ はやく ／ ↑・X まわす ／ Z ぎゃくに まわす ／ スペース いっきに ／ C ホールド ／ P ていし</p>
            <button type="button" id="start">スタート</button>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
