<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e1b4b">
    <title>ナワバリバトル</title>
    <script src="../shared/landscape.js"></script>
    <script src="../shared/audio-session.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: system-ui, -apple-system, 'Hiragino Sans', sans-serif;
            background: linear-gradient(160deg, #312e81 0%, #1e1b4b 100%);
            color: white;
            container-type: size;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            height: 100%;
            display: grid;
            grid-template: minmax(0, 1fr) / minmax(0, 1fr);
            padding:
                max(4px, env(safe-area-inset-top))
                max(4px, env(safe-area-inset-right))
                max(4px, env(safe-area-inset-bottom))
                max(4px, env(safe-area-inset-left));
        }

        .hud {
            grid-area: 1 / 1;
            align-self: start;
            justify-self: center;
            z-index: 2;
            width: min(60%, 420px);
            margin-top: 6px;
            padding: 4px 10px 6px;
            border-radius: 10px;
            background: rgba(15, 23, 42, 0.6);
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        .player-score {
            color: #93c5fd;
        }

        .cpu-score {
            color: #fca5a5;
        }

        .timer {
            font-size: 1.4em;
        }

        .timer.hurry {
            color: #fbbf24;
        }

        .turf {
            display: flex;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            background: #475569;
        }

        .turf-player,
        .turf-cpu {
            width: 50%;
            transition: width 0.2s;
        }

        .turf-player {
            background: #3b82f6;
        }

        .turf-cpu {
            background: #ef4444;
        }

        .field {
            grid-area: 1 / 1;
            position: relative;
            container-type: size;
            display: grid;
            place-items: center;
            min-height: 0;
        }

        .board {
            position: relative;
            --aspect: 1.3333;
            width: min(100cqw, 100cqh * var(--aspect));
            aspect-ratio: var(--aspect);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border: 3px solid #0f172a;
            border-radius: 10px;
            background: #e0e0e0;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 16px;
            text-align: center;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 10px;
        }

        .overlay.show {
            display: flex;
        }

        .overlay h1,
        .overlay h2 {
            font-size: 1.8em;
        }

        .overlay p {
            line-height: 1.6;
            color: #cbd5e1;
            font-size: 0.95em;
        }

        .key-hint {
            display: none;
        }

        @media (hover: hover) and (pointer: fine) {
            .key-hint {
                display: block;
            }
        }

        .overlay button {
            background: #f59e0b;
            color: #1e1b4b;
            border: none;
            padding: 14px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 999px;
            cursor: pointer;
        }

        .overlay button:active {
            transform: scale(0.96);
        }

        .level-badge {
            padding: 4px 14px;
            border-radius: 999px;
            background: #ef4444;
            color: white;
            font-weight: bold;
        }

        .overlay .result-level {
            color: #fde047;
            font-weight: bold;
            font-size: 1.1em;
        }

        .overlay .link-btn {
            background: none;
            color: #cbd5e1;
            padding: 4px 8px;
            font-size: 0.85em;
            font-weight: normal;
            text-decoration: underline;
        }

        .overlay .link-btn[hidden] {
            display: none;
        }

        .history-totals {
            font-weight: bold;
            color: #fde047;
        }

        .history-list {
            list-style: none;
            width: min(100%, 420px);
            max-height: 55%;
            overflow-y: auto;
            touch-action: pan-y;
            font-variant-numeric: tabular-nums;
            font-size: 0.9em;
        }

        .history-item {
            display: grid;
            grid-template-columns: auto 4.5em 3.5em 1fr;
            gap: 8px;
            padding: 6px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            text-align: left;
        }

        .history-item span:last-child {
            text-align: right;
        }

        .history-item[data-outcome="win"] span:nth-child(2) {
            color: #34d399;
        }

        .history-item[data-outcome="lose"] span:nth-child(2) {
            color: #f87171;
        }

        .history-item[data-outcome="draw"] span:nth-child(2) {
            color: #fbbf24;
        }

        .overlay p[hidden] {
            display: none;
        }

        .mute-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 1;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: rgba(15, 23, 42, 0.6);
            font-size: 18px;
            cursor: pointer;
        }

        .back {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 1;
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .win {
            color: #34d399;
        }

        .lose {
            color: #f87171;
        }

        .draw {
            color: #fbbf24;
        }

        .stick-base {
            position: fixed;
            z-index: 3;
            width: 100px;
            height: 100px;
            margin: -50px 0 0 -50px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: rgba(15, 23, 42, 0.3);
            display: none;
            place-items: center;
            pointer-events: none;
        }

        .stick-base.active {
            display: grid;
        }

        .stick-knob {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(147, 197, 253, 0.85);
        }

        .special-btn {
            grid-area: 1 / 1;
            align-self: end;
            justify-self: start;
            z-index: 2;
            margin: 0 0 16px 16px;
            width: 96px;
            aspect-ratio: 1;
            border-radius: 50%;
            border: none;
            background: conic-gradient(#f59e0b calc(var(--gauge, 0) * 1%), #334155 0);
            display: grid;
            place-items: center;
            color: white;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            touch-action: none;
        }

        .special-btn span {
            width: 84%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #1e1b4b;
            display: grid;
            place-items: center;
            line-height: 1.2;
            pointer-events: none;
        }

        .special-btn.ready {
            background: #10b981;
            animation: pulse 0.8s infinite alternate;
        }

        .special-btn.special-active {
            background: #fbbf24;
            animation: pulse 0.25s infinite alternate;
        }

        @keyframes pulse {
            to {
                transform: scale(1.08);
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="hud">
            <div class="hud-row">
                <span class="player-score">あなた <span id="playerScore">0</span>%</span>
                <span class="timer" id="timerBox"><span id="timer">30</span></span>
                <span class="cpu-score"><span id="cpuScore">0</span>% CPU <span id="cpuLevel">Lv.1</span></span>
            </div>
            <div class="turf">
                <div class="turf-player" id="playerTurf"></div>
                <div class="turf-cpu" id="cpuTurf"></div>
            </div>
        </header>

        <div class="field">
            <div class="board">
                <canvas id="gameCanvas" width="800" height="600"></canvas>
                <a class="back" href="../" aria-label="トップへ戻る">←</a>
                <button type="button" class="mute-btn" id="muteBtn" aria-label="音を消す">🔊</button>

                <div class="overlay show" id="startOverlay">
                    <h1>ナワバリバトル</h1>
                    <p class="level-badge">VS CPU <span id="startLevel">Lv.1</span></p>
                    <p>
                        画面のどこでもドラッグして移動。<br>
                        ⭐を2つ取って左下の SP ボタンで必殺技！<br>
                        30秒で CPU より多く塗ろう
                    </p>
                    <p class="key-hint">キーボード: WASD / 矢印キーで移動、スペースで必殺技</p>
                    <button type="button" id="startBtn">スタート</button>
                    <button type="button" class="link-btn history-btn">📜 対戦履歴</button>
                    <button type="button" class="link-btn" id="resetLevelBtn" hidden>Lv.1 からやり直す</button>
                </div>

                <div class="overlay" id="gameOver">
                    <h2 id="resultText"></h2>
                    <p id="resultDetail"></p>
                    <p class="result-level" id="resultLevel"></p>
                    <button type="button" id="playAgainBtn">もう一度</button>
                    <button type="button" class="link-btn history-btn">📜 対戦履歴</button>
                </div>

                <div class="overlay" id="historyOverlay">
                    <h2>対戦履歴</h2>
                    <p class="history-totals" id="historyTotals"></p>
                    <ol class="history-list" id="historyList"></ol>
                    <p id="historyEmpty">まだ対戦していません</p>
                    <button type="button" id="closeHistoryBtn">もどる</button>
                </div>
            </div>
        </div>

        <div class="stick-base" id="stickBase">
            <div class="stick-knob" id="stickKnob"></div>
        </div>

        <button type="button" class="special-btn" id="specialBtn">
            <span id="specialLabel">SP<br>0%</span>
        </button>
    </div>

    <script src="sound.js"></script>
    <script src="history.js"></script>
    <script src="game.js"></script>
</body>
</html>
