<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1e1b4b">
    <title>ナワバリバトル</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: system-ui, -apple-system, 'Hiragino Sans', sans-serif;
            background: linear-gradient(160deg, #312e81 0%, #1e1b4b 100%);
            color: white;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            height: 100dvh;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto minmax(0, 1fr) minmax(140px, 24dvh);
            grid-template-areas:
                "hud hud"
                "field field"
                "special stick";
            gap: 6px;
            padding:
                max(8px, env(safe-area-inset-top))
                max(8px, env(safe-area-inset-right))
                max(8px, env(safe-area-inset-bottom))
                max(8px, env(safe-area-inset-left));
        }

        @media (orientation: landscape) and (max-height: 600px) {
            .app {
                grid-template-columns: minmax(110px, 1fr) 4fr minmax(110px, 1fr);
                grid-template-rows: auto minmax(0, 1fr);
                grid-template-areas:
                    "hud hud hud"
                    "special field stick";
            }
        }

        .hud {
            grid-area: hud;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }

        .player-score {
            color: #93c5fd;
        }

        .cpu-score {
            color: #fca5a5;
        }

        .timer {
            font-size: 1.4em;
        }

        .timer.hurry {
            color: #fbbf24;
        }

        .turf {
            display: flex;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            background: #475569;
        }

        .turf-player,
        .turf-cpu {
            width: 50%;
            transition: width 0.2s;
        }

        .turf-player {
            background: #3b82f6;
        }

        .turf-cpu {
            background: #ef4444;
        }

        .field {
            grid-area: field;
            position: relative;
            container-type: size;
            display: grid;
            place-items: center;
            min-height: 0;
        }

        .board {
            position: relative;
            --aspect: 1.3333;
            width: min(100cqw, 100cqh * var(--aspect));
            aspect-ratio: var(--aspect);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border: 3px solid #0f172a;
            border-radius: 10px;
            background: #e0e0e0;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 16px;
            text-align: center;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 10px;
        }

        .overlay.show {
            display: flex;
        }

        .overlay h1,
        .overlay h2 {
            font-size: 1.8em;
        }

        .overlay p {
            line-height: 1.6;
            color: #cbd5e1;
            font-size: 0.95em;
        }

        .key-hint {
            display: none;
        }

        @media (hover: hover) and (pointer: fine) {
            .key-hint {
                display: block;
            }
        }

        .overlay button {
            background: #f59e0b;
            color: #1e1b4b;
            border: none;
            padding: 14px 40px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 999px;
            cursor: pointer;
        }

        .overlay button:active {
            transform: scale(0.96);
        }

        .level-badge {
            padding: 4px 14px;
            border-radius: 999px;
            background: #ef4444;
            color: white;
            font-weight: bold;
        }

        .overlay .result-level {
            color: #fde047;
            font-weight: bold;
            font-size: 1.1em;
        }

        .overlay .link-btn {
            background: none;
            color: #cbd5e1;
            padding: 4px 8px;
            font-size: 0.85em;
            font-weight: normal;
            text-decoration: underline;
        }

        .overlay .link-btn[hidden] {
            display: none;
        }

        .mute-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 1;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: rgba(15, 23, 42, 0.6);
            font-size: 18px;
            cursor: pointer;
        }

        .win {
            color: #34d399;
        }

        .lose {
            color: #f87171;
        }

        .draw {
            color: #fbbf24;
        }

        .stick-zone {
            grid-area: stick;
            position: relative;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.06);
            overflow: hidden;
        }

        .stick-zone-label {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 8px;
            text-align: center;
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }

        .stick-base {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 100px;
            height: 100px;
            margin: -50px 0 0 -50px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.08);
            display: grid;
            place-items: center;
            pointer-events: none;
        }

        .stick-knob {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(147, 197, 253, 0.85);
        }

        .special-btn {
            grid-area: special;
            align-self: center;
            justify-self: center;
            width: min(110px, 80%);
            aspect-ratio: 1;
            border-radius: 50%;
            border: none;
            background: conic-gradient(#f59e0b calc(var(--gauge, 0) * 1%), #334155 0);
            display: grid;
            place-items: center;
            color: white;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            touch-action: none;
        }

        .special-btn span {
            width: 84%;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #1e1b4b;
            display: grid;
            place-items: center;
            line-height: 1.2;
            pointer-events: none;
        }

        .special-btn.ready {
            background: #10b981;
            animation: pulse 0.8s infinite alternate;
        }

        .special-btn.special-active {
            background: #fbbf24;
            animation: pulse 0.25s infinite alternate;
        }

        @keyframes pulse {
            to {
                transform: scale(1.08);
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="hud">
            <div class="hud-row">
                <span class="player-score">あなた <span id="playerScore">0</span>%</span>
                <span class="timer" id="timerBox"><span id="timer">30</span></span>
                <span class="cpu-score"><span id="cpuScore">0</span>% CPU <span id="cpuLevel">Lv.1</span></span>
            </div>
            <div class="turf">
                <div class="turf-player" id="playerTurf"></div>
                <div class="turf-cpu" id="cpuTurf"></div>
            </div>
        </header>

        <div class="field">
            <div class="board">
                <canvas id="gameCanvas" width="800" height="600"></canvas>
                <button type="button" class="mute-btn" id="muteBtn" aria-label="音を消す">🔊</button>

                <div class="overlay show" id="startOverlay">
                    <h1>ナワバリバトル</h1>
                    <p class="level-badge">VS CPU <span id="startLevel">Lv.1</span></p>
                    <p>
                        右の操作エリアをドラッグして移動。<br>
                        ⭐を2つ取って左の SP ボタンで必殺技！<br>
                        30秒で CPU より多く塗ろう
                    </p>
                    <p class="key-hint">キーボード: WASD / 矢印キーで移動、スペースで必殺技</p>
                    <button type="button" id="startBtn">スタート</button>
                    <button type="button" class="link-btn" id="resetLevelBtn" hidden>Lv.1 からやり直す</button>
                </div>

                <div class="overlay" id="gameOver">
                    <h2 id="resultText"></h2>
                    <p id="resultDetail"></p>
                    <p class="result-level" id="resultLevel"></p>
                    <button type="button" id="playAgainBtn">もう一度</button>
                </div>
            </div>
        </div>

        <div class="stick-zone" id="stickZone">
            <div class="stick-base" id="stickBase">
                <div class="stick-knob" id="stickKnob"></div>
            </div>
            <span class="stick-zone-label">ドラッグで移動</span>
        </div>

        <button type="button" class="special-btn" id="specialBtn">
            <span id="specialLabel">SP<br>0%</span>
        </button>
    </div>

    <script src="sound.js"></script>
    <script src="game.js"></script>
</body>
</html>
